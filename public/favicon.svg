<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Ombre portée pour la carte -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#051a0c" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Fond vert feutrine plein -->
  <rect width="512" height="512" fill="#14592d"/>

  <!-- Carte blanche avec ombre et coins arrondis proportionnels poker -->
  <g filter="url(#shadow)">
    <rect x="136" y="56" width="240" height="340" rx="16" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>

    <!-- Index As de pique haut-gauche -->
    <text x="156" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="38" fill="#1a1a1a" text-anchor="middle">A</text>
    <g transform="translate(144, 114) scale(0.24)">
      <path fill="#1a1a1a" d="M50,10 C50,10 16,46 16,62 C16,74 26,80 37,80 C44,80 48,76 50,71 C50,78 45,86 42,90 L58,90 C55,86 50,78 50,71 C52,76 56,80 63,80 C74,80 84,74 84,62 C84,46 50,10 50,10 Z"/>
    </g>

    <!-- Grand symbole Pique central -->
    <g transform="translate(201, 166) scale(1.1)">
      <path fill="#1a1a1a" d="M50,10 C50,10 16,46 16,62 C16,74 26,80 37,80 C44,80 48,76 50,71 C50,78 45,86 42,90 L58,90 C55,86 50,78 50,71 C52,76 56,80 63,80 C74,80 84,74 84,62 C84,46 50,10 50,10 Z"/>
    </g>

    <!-- Index As de pique bas-droite (inversé) -->
    <g transform="rotate(180 256 226)">
      <text x="156" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="38" fill="#1a1a1a" text-anchor="middle">A</text>
      <g transform="translate(144, 114) scale(0.24)">
        <path fill="#1a1a1a" d="M50,10 C50,10 16,46 16,62 C16,74 26,80 37,80 C44,80 48,76 50,71 C50,78 45,86 42,90 L58,90 C55,86 50,78 50,71 C52,76 56,80 63,80 C74,80 84,74 84,62 C84,46 50,10 50,10 Z"/>
      </g>
    </g>
  </g>
</svg>